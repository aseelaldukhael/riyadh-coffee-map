<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riyadh Cafe Competition Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EFE5;--card:#FFFDF9;--ink:#2B1B14;--muted:#7A6657;--line:#E6D8C6;--brown:#6F4E37;--car:#C68B59;--tan:#D3BFA6;--cream:#EFE3D1;--hi:#6F4E37;--mid:#C68B59;--lo:#D9C6AE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;line-height:1.6}
header{background:#2B1B14;color:#F6EFE5;padding:22px 20px 26px}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
header h1{margin:0;font-size:clamp(1.4rem,3.6vw,2rem);font-weight:800;line-height:1.3}
header p{margin:6px 0 0;color:#D8C4AE;font-size:.98rem}
header a{color:#E8C9A0}
#lang{font:inherit;font-weight:700;font-size:.88rem;color:#2B1B14;background:#E8C9A0;border:0;border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp>span{color:var(--muted);font-size:.85rem;margin-inline-end:4px}
.chip{font:inherit;font-size:.88rem;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 13px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--car)}
.chip[aria-pressed=true]{background:var(--brown);border-color:var(--brown);color:#FFF8EE}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
input[type=search]{font:inherit;font-size:.9rem;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);min-width:170px}
.main{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.card h2{margin:0 0 2px;font-size:1.05rem}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 6px}
svg{display:block;width:100%;height:auto;overflow:visible;direction:ltr}
svg text{font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.pl h3{margin:12px 0 4px;font-size:.98rem;display:flex;align-items:center;gap:8px}
.pl h3 i{width:11px;height:11px;border-radius:50%;display:inline-block}
.pl .row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 8px;border-radius:10px;cursor:pointer;font-size:.92rem}
.pl .row:hover,.pl .row.sel{background:var(--cream)}
.pl .row .num{color:var(--muted);font-size:.8rem}
.pl .row .v{font-weight:700;direction:ltr;text-align:left}
html[lang=en] .pl .row .v{text-align:right}
.pl .row .v small{font-weight:400;color:var(--muted);font-size:.76rem;margin-left:10px}
.pl .sel-box{margin-top:12px;background:#2B1B14;color:#F6EFE5;border-radius:12px;padding:10px 14px;font-size:.9rem}
.pl .sel-box b{font-size:1.05rem}
.rank{margin-top:16px}
.rank .row{display:grid;grid-template-columns:130px 1fr 56px;gap:10px;align-items:center;padding:3px 6px;border-radius:8px;cursor:pointer;font-size:.9rem}
.rank .row:hover,.rank .row.sel{background:var(--cream)}
.rank .track{height:12px;background:#F1E7D8;border-radius:6px;overflow:hidden}
.rank .fill{height:100%;border-radius:6px}
.rank .val{font-weight:700;direction:ltr;text-align:left}
html[lang=en] .rank .val{text-align:right}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.note{margin:16px 0 40px;color:var(--muted);font-size:.82rem}
.note details{margin-top:6px}
.tip{position:fixed;pointer-events:none;background:#2B1B14;color:#F6EFE5;padding:7px 11px;border-radius:10px;font-size:.84rem;line-height:1.5;opacity:0;z-index:10}
@media(max-width:820px){.main{grid-template-columns:1fr}.sep{display:none}}
</style>
</head>

 none:'لا توجد أحياء بهذه الفلاتر',cafes:'مقهى',perkm:'مقهى/كم²',chainsW:'سلاسل',lvl:{hi:'منافسة عالية',mid:'منافسة متوسطة',lo:'منافسة منخفضة'},
 v:{few:'عدد المقاهي قليل، فالأرقام غير مستقرة.',hiC:'منافسة عالية والسلاسل حاضرة بقوة.',hiI:'منافسة عالية ومعظمها مقاهٍ مستقلة.',hiB:'منافسة عالية بتوازن بين السلاسل والمستقلة.',midC:'منافسة متوسطة والسلاسل أعلى من المعتاد.',mid:'منافسة متوسطة.',lo:'منافسة منخفضة. قد تعني مساحة فارغة أو طلباً أقل، ويُستحسن التحقق ميدانياً.'},
 noteH:'مستوى المنافسة = عدد المقاهي لكل كم² (عالية ≥ 6، متوسطة 2.5–6، منخفضة أقل من 2.5). هذا وصف لما هو <b>مسجّل في OpenStreetMap وOverture</b> وليس قراراً استثمارياً: لا يشمل المبيعات أو السكان أو الإيجارات، وبعض المقاهي غير مسجّلة أو مغلقة.',
 how:'طريقة الحساب وحدود البيانات',
 howl:['3,270 مقهى في 143 حياً (استُبعد مطار الملك خالد من الترتيب لأن مضلّعه 251 كم²).','حجم الحي: صغير أقل من 5 كم²، متوسط 5–20، واسع أكثر من 20.','السلاسل: علامة معروفة أو اسم يتكرر 5 مرات فأكثر. التصنيف تقريبي.','91% من السجلات من Overture فقط، وحدود الأحياء من مجموعة مجتمعية قد تخطئ قرب الحدود.','الأحياء التي فيها أقل من 10 مقاهٍ أرقامها غير مستقرة.']}};
let lang=(new URLSearchParams(location.search).get('lang')==='ar')?'ar':'en';
const T=k=>L[lang][k];
const NF=n=>Number(n).toLocaleString('en-US');
const lvl=d=>d>=6?'hi':d>=2.5?'mid':'lo';
const COL={hi:'#6F4E37',mid:'#C68B59',lo:'#D9C6AE'};
const st={size:'all',min:10,q:'',m:'d',o:'desc',sel:'العليا',k:5};
const nm=r=>lang==='en'?r.e:r.n;
const bn=b=>lang==='en'?(BR[b]||b):b;
const tip=document.getElementById('tip');
function showTip(e,h){tip.innerHTML=h;tip.style.opacity=1;let x=e.clientX+14;if(x+tip.offsetWidth>innerWidth-8)x=e.clientX-tip.offsetWidth-14;tip.style.left=x+'px';tip.style.top=e.clientY+14+'px'}
const hideTip=()=>tip.style.opacity=0;
const sizeOf=a=>a<5?'s':a<=20?'m':'l';
const q=()=>st.q.toLowerCase();
function pass(r){return r.c>=st.min&&(st.size==='all'||sizeOf(r.a)===st.size)&&(!st.q||r.n.includes(st.q)||r.e.toLowerCase().includes(q()))}
function el(t,a,x){const n=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)n.setAttribute(k,a[k]);if(x!=null)n.textContent=x;return n}

function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=T('title');
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
 document.querySelector('[data-i="noteH"]').innerHTML=T('noteH');
 document.getElementById('q').placeholder=T('search');
 document.getElementById('lang').textContent=lang==='en'?'العربية':'English';
 document.getElementById('howl').innerHTML=T('howl').map(x=>`<li>${x}</li>`).join('');
 document.getElementById('ord').textContent=T(st.o==='desc'?'ordD':'ordA');
}
function drawScatter(){
 const host=document.getElementById('sc');host.innerHTML='';
 const W=640,H=380,m={l:44,r:14,t:12,b:42};const s=el('svg',{viewBox:`0 0 ${W} ${H}`});host.appendChild(s);
 const mx=18,X=d=>m.l+Math.sqrt(d/mx)*(W-m.l-m.r),Y=p=>H-m.b-(p/100)*(H-m.t-m.b);
 [0,25,50,75,100].forEach(v=>{s.appendChild(el('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'#E6D8C6'}));s.appendChild(el('text',{x:m.l-8,y:Y(v)+4,'text-anchor':'end','font-size':11.5,fill:'#7A6657'},v+'%'))});
 [0,1,2.5,6,12].forEach(v=>s.appendChild(el('text',{x:X(v),y:H-m.b+18,'text-anchor':'middle','font-size':11.5,fill:'#7A6657'},v)));
 s.appendChild(el('text',{x:(W+m.l)/2,y:H-4,'text-anchor':'middle','font-size':12,fill:'#7A6657'},T('xl')));
 [2.5,6].forEach(v=>s.appendChild(el('line',{x1:X(v),x2:X(v),y1:m.t,y2:H-m.b,stroke:'#D3BFA6','stroke-dasharray':'3 4'})));
 const ay=Y(AVG);s.appendChild(el('line',{x1:m.l,x2:W-m.r,y1:ay,y2:ay,stroke:'#C68B59','stroke-dasharray':'5 4'}));
 s.appendChild(el('text',{x:m.l+4,y:ay-5,'text-anchor':'start','font-size':11,fill:'#7A6657'},T('avg')+AVG+'%'));
 const vis=R.filter(pass).sort((a,b)=>b.c-a.c);
 R.filter(r=>!pass(r)).forEach(r=>s.appendChild(el('circle',{cx:X(r.d),cy:Y(r.p),r:3,fill:'#E3D6C3',opacity:.7})));
 vis.forEach(r=>{const l=lvl(r.d),sel=r.n===st.sel,rad=Math.max(4,Math.sqrt(r.c)*1.15);
  const c=el('circle',{cx:X(r.d),cy:Y(r.p),r:rad,fill:COL[l],stroke:sel?'#2B1B14':'#FFFDF9','stroke-width':sel?3:2,'fill-opacity':.92,style:'cursor:pointer'});
  c.addEventListener('mousemove',e=>showTip(e,`<b>${nm(r)}</b><br>${r.c} ${T('cafes')} · ${r.d} ${T('perkm')}<br>${r.p}% ${T('chainsW')}`));c.addEventListener('mouseleave',hideTip);
  c.addEventListener('click',()=>{st.sel=r.n;render()});s.appendChild(c)});
 vis.filter(r=>r.n===st.sel||r.c>=100).forEach(r=>s.appendChild(el('text',{x:X(r.d),y:Y(r.p)-Math.max(4,Math.sqrt(r.c)*1.15)-5,'text-anchor':'middle','font-size':12.5,'font-weight':700,fill:'#2B1B14',style:'paint-order:stroke;stroke:#FFFDF9;stroke-width:3px'},nm(r))));
 if(!vis.length)s.appendChild(el('text',{x:W/2,y:H/2,'text-anchor':'middle','font-size':14,fill:'#7A6657'},T('none')));
}
function verdict(r){const l=lvl(r.d),hiC=r.p>=AVG+8,loC=r.p<=AVG-8,v=L[lang].v;
 if(r.c<10)return v.few;
 if(l==='hi')return hiC?v.hiC:loC?v.hiI:v.hiB;
 if(l==='mid')return hiC?v.midC:v.mid;
 return v.lo}
function drawDetail(){
 const h=document.getElementById('detail'),k=st.k,pool=R.filter(pass);
 if(!pool.length){h.innerHTML=`<div class="empty">${T('none')}</div>`;return}
 const by=pool.slice().sort((a,b)=>b.d-a.d),top=by.slice(0,k),low=by.slice(-k).reverse();
 const row=(r,i)=>`<div class="row ${r.n===st.sel?'sel':''}" data-n="${r.n}"><span class="num">${i+1}</span><span>${nm(r)}</span><span class="v">${r.d}<small>${r.p}% ${T('ch')}</small></span></div>`;
 const sel=R.find(x=>x.n===st.sel);
 h.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>${T('plT')}</h2>
  <div class="grp"><button class="chip" data-k="5" aria-pressed="${k===5}">5</button><button class="chip" data-k="10" aria-pressed="${k===10}">10</button></div></div>
  <p class="sub">${T('plS')}</p>
  <h3><i style="background:${COL.hi}"></i>${T('top')}</h3>${top.map(row).join('')}
  <h3><i style="background:${COL.lo};border:1px solid #C9B39A"></i>${T('low')}</h3>${low.map(row).join('')}
  ${sel?`<div class="sel-box"><b>${nm(sel)}</b> · ${T('lvl')[lvl(sel.d)]}<br>${sel.c} ${T('cafes')} · ${sel.d} ${T('perkm')} · ${sel.p}% ${T('chainsW')}<br>${verdict(sel)}</div>`:''}`;
 h.querySelectorAll('.row').forEach(e=>e.addEventListener('click',()=>{st.sel=e.dataset.n;render()}));
 h.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{st.k=Number(b.dataset.k);render()}));
}
function drawList(){
 const key=st.m,all=R.filter(pass),vis=all.slice().sort((a,b)=>st.o==='desc'?b[key]-a[key]:a[key]-b[key]).slice(0,12);
 const max=Math.max(1,...all.map(r=>r[key])),f=v=>key==='p'?v+'%':key==='c'?NF(v):v;
 document.getElementById('list').innerHTML=vis.length?vis.map(r=>`<div class="row ${r.n===st.sel?'sel':''}" data-n="${r.n}"><span>${nm(r)}</span><div class="track"><div class="fill" style="width:${r[key]/max*100}%;background:${COL[lvl(r.d)]}"></div></div><span class="val">${f(r[key])}</span></div>`).join(''):`<div class="empty">${T('none')}</div>`;
 document.querySelectorAll('#list .row').forEach(e=>e.addEventListener('click',()=>{st.sel=e.dataset.n;render();scrollTo({top:0,behavior:'smooth'})}));
}
function render(){drawScatter();drawDetail();drawList()}
function bind(sel,attr,key,conv){document.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll(sel).forEach(x=>x.setAttribute('aria-pressed',x===b));st[key]=conv?conv(b.dataset[attr]):b.dataset[attr];render()}))}
bind('[data-size]','size','size');bind('[data-min]','min','min',Number);bind('[data-m]','m','m');
document.getElementById('ord').addEventListener('click',()=>{st.o=st.o==='desc'?'asc':'desc';applyLang();render()});
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value.trim();render()});
document.getElementById('lang').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';applyLang();render()});
applyLang();render();
</script>
</body>
</html>
